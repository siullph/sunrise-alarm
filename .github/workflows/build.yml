name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sunrise-alarm-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "Latest debug build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sunrise-alarm-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest sunrise-alarm-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Debug APK built from ${GITHUB_SHA::7}."

      - name: Publish to the apk branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir apk-out
          cp sunrise-alarm-debug.apk apk-out/
          cd apk-out
          git init -q -b apk
          git add sunrise-alarm-debug.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Debug APK for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
